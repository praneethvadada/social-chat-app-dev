spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Routes are configured in GatewayConfig.java
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - http://localhost:*
              - http://127.0.0.1:*
              - http://192.168.*:*
              - http://10.*:*
              - http://172.16.*:*
              - http://172.17.*:*
              - http://172.18.*:*
              - http://172.19.*:*
              - http://172.2*:*
              - http://172.30.*:*
              - http://172.31.*:*
              # Production web deployment (Hostinger VPS)
              - https://www.rchat.revolutionworldinc.com
              - https://rchat.revolutionworldinc.com
              - https://*.revolutionworldinc.com
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
        add-to-simple-url-handler-mapping: true

server:
  port: ${PORT:8080}

jwt:
  secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.boot.context.config: DEBUG
    reactor.netty: DEBUG
