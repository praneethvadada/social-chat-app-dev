#application-properties social
spring.application.name=social-service
server.port=8082

# Local-machine overrides (AWS keys, etc.) live in application-local.properties,
# same directory — gitignored (repo root .gitignore's "application-*.properties"
# rule), loaded automatically when present, silently skipped otherwise.
spring.config.import=optional:application-local.properties

# ✅ Force UTC timezone across entire application
spring.jackson.time-zone=UTC
spring.jackson.default-time-zone=UTC

# Database Configuration - social-service owns social_posts_db.
# Identity lives in auth_db (auth-service); user_profiles here is a read-replica
# of the identity fields plus the social fields this service owns.
spring.datasource.url=jdbc:mysql://localhost:3306/social_posts_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nani123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
# ✅ Ensure Hibernate uses UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis Configuration - DISABLED (cluster not available)
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
management.health.redis.enabled=false

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Phase 10 hardening: gates /blocks/internal/**, /profiles/internal/**, and
# is sent on every outgoing internal call this service makes. MUST match
# the same property in auth-service and social-chats-service.
internal.service.secret=6c3428aac8c40a08ffd15b50dbcc953e5cdb4f5343578386de8b5e682067fee9

# auth-service URL: identity (username/full name) is written there, not here
auth.service.url=http://localhost:8081

# chats-service URL for relaying real-time notifications (posts -> chat clients)
chats.service.url=http://localhost:8083

# File Upload Configuration (S3)
aws.s3.bucket-name=r-chat-media
aws.s3.region=ap-south-1
# aws.s3.access-key / aws.s3.secret-key are NOT set here on purpose — this
# file is committed to git. Put the real values in application-local.properties
# (gitignored, same directory) for local dev. Leave them unset in production
# and attach an IAM role to the running instance instead — see S3Config.java.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Logging
logging.level.com.socialmedia.social=DEBUG
logging.level.org.springframework.web=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Agora configuration (set via environment in production)
agora.app-id=96f2b1afbf744dc5818487f2e31ed9e7
agora.app-cert=ef473b70af0d40989d94ca2d7ce5c248
