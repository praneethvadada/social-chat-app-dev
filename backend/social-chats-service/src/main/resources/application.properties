# application-properties: social-chats-service
spring.application.name=social-chats-service
server.port=8083

# Local-only secret overrides (gitignored) — copy
# application-local.properties.example to application-local.properties and
# fill in real values; never commit that file. Safe to be absent (env vars
# or CI secrets manager can supply the same keys instead).
spring.config.import=optional:application-local.properties

# ✅ Force UTC timezone across entire application (matches social-service)
spring.jackson.time-zone=UTC
spring.jackson.default-time-zone=UTC

# Database Configuration - dedicated chats database
spring.datasource.url=jdbc:mysql://localhost:3306/social_chats_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nani123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis - DISABLED (not available yet; presence is in-memory for now)
management.health.redis.enabled=false

# JWT Configuration (MUST match the other services so tokens validate)
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000

# Phase 10 hardening: gates /internal/relay/**, and is sent on every
# outgoing internal call this service makes. MUST match the same property
# in auth-service and social-service.
internal.service.secret=6c3428aac8c40a08ffd15b50dbcc953e5cdb4f5343578386de8b5e682067fee9

# File upload limits (media_url only; actual upload handled by posts service)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# S3 bucket/region - used only to build full media/avatar URLs from stored
# keys. Was stale (pointed at the old, now-unused bucket from before the
# r-chat-media migration) — chat message/avatar media URLs built from this
# were pointing at the wrong bucket.
aws.s3.bucket-name=r-chat-media
aws.s3.region=ap-south-1

# Logging (dial down to INFO for prod)
logging.level.com.socialmedia.chats=DEBUG
logging.level.org.springframework.web=INFO

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Agora configuration (for call tokens). No real value committed here —
# supply AGORA_APP_ID / AGORA_APP_CERT as real environment variables, or
# put them in a local, gitignored application-local.properties (see
# application-local.properties.example). Empty at runtime means Agora
# token requests will fail with an auth error until configured.
agora.app-id=${AGORA_APP_ID:}
agora.app-cert=${AGORA_APP_CERT:}

# URLs of sibling services for cross-service REST lookups (Phase 4)
auth.service.url=http://localhost:8081
social.service.url=http://localhost:8082
