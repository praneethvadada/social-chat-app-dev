#application properties
spring.application.name=auth-service
server.port=8081

# Local-only secret overrides (gitignored) — copy
# application-local.properties.example to application-local.properties and
# fill in real values (e.g. Twilio credentials); never commit that file.
# Safe to be absent (env vars or a secrets manager can supply the same keys
# instead).
spring.config.import=optional:application-local.properties

# Database Configuration (unified with auth-service)
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Nani123@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration - Make optional
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000
spring.cache.type=none

# Disable email sending in local/dev unless credentials configured
app.mail.enabled=true

# JWT Configuration
jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Phase 10 hardening: shared secret gating service-to-service "internal"
# endpoints (/users/**, /internal/sessions/**) - these were previously in
# SecurityConfig's permitAll with ZERO check that the caller was actually
# another backend service rather than any internet client hitting them
# directly through the gateway's /api/auth/** route (confirmed reachable -
# GatewayConfig strips the prefix and proxies straight through, no gating
# in between). Worst case was PUT /users/{id}/identity: anyone could rename
# ANY account's username/fullName with zero authentication. MUST match the
# same property in social-service and social-chats-service, same convention
# as jwt.secret above.
internal.service.secret=6c3428aac8c40a08ffd15b50dbcc953e5cdb4f5343578386de8b5e682067fee9

# Security
spring.security.user.name=admin
spring.security.user.password=admin123

# Logging
logging.level.com.socialmedia.auth=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Email Configuration (Hostinger SMTP — no-reply@revolutionworldinc.com).
# Switched away from Gmail app-password auth. Hostinger's mail servers use
# SSL on port 465 by default (STARTTLS on 587 is the fallback if 465 is
# ever blocked by a network/firewall — swap ssl.enable/starttls.enable below
# to switch). No real credentials committed here — supply MAIL_USERNAME /
# MAIL_PASSWORD as real environment variables, or put them in a local,
# gitignored application-local.properties (see
# application-local.properties.example). Empty at runtime means email sends
# will fail with an auth error until configured (app.mail.enabled=true above
# still tries to send; set it to false instead if you don't need email
# locally).
spring.mail.host=${MAIL_HOST:smtp.hostinger.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.hostinger.com

# Frontend URL for email links
app.frontend.url=http://localhost:3000

# Phone OTP configuration (see PhoneOtpService, PhoneAuthController)
otp.length=6
otp.expiry-seconds=300
otp.max-attempts=5
otp.resend-cooldown-seconds=60
otp.max-requests-per-hour=5
otp.ip-rate-limit-per-hour=20
otp.verification-proof-validity-minutes=30

# SMS provider for phone OTP delivery. "noop" (default) logs instead of
# sending — safe for local dev with zero external config. Set to "twilio"
# and supply real credentials via application-local.properties or env vars
# to actually send SMS.
sms.provider=noop
sms.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
sms.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
sms.twilio.from-number=${TWILIO_FROM_NUMBER:}

# Phase 3: used by ChatsServiceRelayClient to push a live WebSocket
# notification (e.g. local_storage.revoked) to a device via chats-service's
# existing generic relay. Mirrors chats-service's own auth.service.url.
chats.service.url=${CHATS_SERVICE_URL:http://localhost:8083}

# Post-Phase-10: used by SecurityPushRelayClient to push a mobile
# notification (e.g. login/login-failed alerts) via social-service's
# existing FCM setup — auth-service has none of its own. Mirrors
# chats.service.url above exactly.
social.service.url=${SOCIAL_SERVICE_URL:http://localhost:8082}
