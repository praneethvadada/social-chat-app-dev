name: social_chat_app
description: A static mock social media + chat Flutter app scaffold.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Use a flexible constraint so `flutter pub get` can pick a compatible version
  # Run `flutter pub add go_router` locally to pin a specific version later.
  go_router: any
  google_fonts: ^6.3.3
  flutter_riverpod: ^2.3.6
  provider: ^6.0.0
  image_picker: any
  video_player: any
  flutter_image_compress: any
  fluttertoast: any
  uuid: ^3.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  # Phase 10 hardening: JWT access token storage (Android Keystore / iOS
  # Keychain on mobile — genuinely encrypted-at-rest, unlike SharedPreferences'
  # plaintext file). See ApiService's own doc comment on getToken/setToken.
  flutter_secure_storage: ^9.2.2
  crop_your_image: 0.7.3
  path_provider: any
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^0.4.4
  video_thumbnail: ^0.5.3
  share_plus: ^12.0.1
  agora_rtc_engine: ^6.5.2
  permission_handler: ^12.0.1
  flutter_ringtone_player: ^4.0.0+4
  intl: ^0.19.0
  # Phone-number country-code flag picker (signup + "add a phone number"
  # settings flow) — previously a plain text field where the user had to
  # type the whole "+919876543210"-style prefix themselves.
  country_code_picker: ^3.0.0
  flutter_local_notifications: ^19.5.0
  # Spec requirement: local chat DB encryption. sqflite_sqlcipher is a
  # drop-in replacement for plain sqflite (same Database/openDatabase API,
  # `package:sqflite_sqlcipher/sqflite.dart` import path, adds a `password`
  # param) - NOT used alongside plain sqflite, they register conflicting
  # native plugin channels. Confirmed via pubspec.lock that nothing else in
  # this dependency tree pulls in plain sqflite transitively, so this is a
  # clean swap, not a coexistence.
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.8.3
  connectivity_plus: ^7.0.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  qr_flutter: ^4.1.0   # GAP-4: render the group invite link as a scannable QR
  device_info_plus: ^11.2.0   # Phase 1: device/session tracking (OS, model)
  package_info_plus: ^8.1.3   # Phase 1: device/session tracking (app version)

dependency_overrides:
  image: 3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo.ico
    - assets/sounds/
