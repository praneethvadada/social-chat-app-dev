name: social_chat_app
description: A static mock social media + chat Flutter app scaffold.
publish_to: 'none'
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Use a flexible constraint so `flutter pub get` can pick a compatible version
  # Run `flutter pub add go_router` locally to pin a specific version later.
  go_router: any
  google_fonts: ^6.3.3
  flutter_riverpod: ^2.3.6
  provider: ^6.0.0
  image_picker: any
  video_player: any
  flutter_image_compress: any
  fluttertoast: any
  uuid: ^3.0.6
  http: ^1.1.0
  shared_preferences: ^2.2.2
  crop_your_image: 0.7.3
  path_provider: any
  web_socket_channel: ^2.4.0
  stomp_dart_client: ^0.4.4
  video_thumbnail: ^0.5.3
  share_plus: ^12.0.1
  agora_rtc_engine: ^6.5.2
  permission_handler: ^12.0.1
  flutter_ringtone_player: ^4.0.0+4
  intl: ^0.19.0
  flutter_local_notifications: ^19.5.0
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^7.0.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  qr_flutter: ^4.1.0   # GAP-4: render the group invite link as a scannable QR

dependency_overrides:
  image: 3.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo.ico
    - assets/sounds/
